<h2 style="font-size:72px;font-weight:500;line-height:1.1">Incremental to iterative</h2>
<img src="assets/14a5804fdd629fcc4b54017454dbf24b.jpg" alt="Top row: wheel, axle, chassis, car, unhappy until the end. Bottom row: skateboard, scooter, bike, motorcycle, car, happier at every step" style="width:1200px;height:560px;object-fit:contain">
<p style="font-size:30px;line-height:1.45;text-align:center;color:#4A5160;width:1500px">We're used to big projects that take a long time and deliver value at the end. That still fits work with a clear end. For our services, we're shifting to smaller amounts of value, growing as we learn.</p>
<aside>Wheels are a component. A skateboard is something you can ride.</aside>
